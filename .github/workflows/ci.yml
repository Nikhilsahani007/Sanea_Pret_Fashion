name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Generated Prisma client is not committed (D-053); no database needed.
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit

  database:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Throwaway service for this run only; not a reusable credential.
      POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sanea
          POSTGRES_DB: sanea_test
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U sanea -d sanea_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      # Migrates a template database, checks drift, then runs *.db-test.ts.
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://sanea:${{ env.POSTGRES_PASSWORD }}@127.0.0.1:5432/sanea_test

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  images:
    name: Production images (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the three release images (Phase 19) without pushing them, and
      # checks the Caddyfile with the image's own Caddy.
      - run: docker build -f deploy/Dockerfile --target api -t sanea-api .
      - run: docker build -f deploy/Dockerfile --target migrate -t sanea-migrate .
      - run: docker build -f deploy/Dockerfile --target web -t sanea-web .
      - run: >-
          docker run --rm -e SHOP_DOMAIN=shop.example.test
          -e ADMIN_DOMAIN=admin.example.test sanea-web
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker run --rm --entrypoint test sanea-migrate -f deploy/compose.production.yaml
      - run: docker run --rm --entrypoint sh sanea-api -c 'test ! -e .env && node --version'
