# One stage on its EC2 instance (phase-19-plan.md §3; deploy/runbook.md). The
# database is Amazon RDS, not a container. Secrets come from /etc/sanea/api.env,
# written by `sanea-env` from Parameter Store (never committed). Run by
# `sanea-release <tag>` on the instance, which sets RELEASE, IMAGE_REGISTRY,
# STAGE, SHOP_DOMAIN and ADMIN_DOMAIN.
name: sanea-pret

services:
  migrate:
    image: ${IMAGE_REGISTRY}/sanea-${STAGE}-migrate:${RELEASE}
    env_file: /etc/sanea/api.env
    volumes:
      - /etc/sanea/rds-ca.pem:/etc/sanea/rds-ca.pem:ro
    profiles: ["release"]

  api:
    image: ${IMAGE_REGISTRY}/sanea-${STAGE}-api:${RELEASE}
    env_file: /etc/sanea/api.env
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      TRUST_PROXY: "1"
      MEDIA_STORAGE_DIR: /var/lib/sanea/media
    volumes:
      - /var/lib/sanea/media:/var/lib/sanea/media
      - /etc/sanea/rds-ca.pem:/etc/sanea/rds-ca.pem:ro
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /sanea/${STAGE}/api

  web:
    image: ${IMAGE_REGISTRY}/sanea-${STAGE}-web:${RELEASE}
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/lib/sanea/media/public:/srv/media/public:ro
      - caddy-data:/data
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /sanea/${STAGE}/web

volumes:
  caddy-data:
